services:
  db:
    image: mysql:8.0
    container_name: youcus-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-youcus}
      MYSQL_USER: ${MYSQL_USER:-youcus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-youcus}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - youcus-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    container_name: youcus-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "mysql://${MYSQL_USER:-youcus}:${MYSQL_PASSWORD:-youcus}@db:3306/${MYSQL_DATABASE:-youcus}"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build: ./client
    container_name: youcus-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  youcus-db-data:
