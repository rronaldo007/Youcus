# Stack Youcus : dev (hot-reload) OU prod, selon le profil actif.
# Le profil est choisi via COMPOSE_PROFILES (lu automatiquement depuis .env) :
#   COMPOSE_PROFILES=dev   -> db + api-dev + web-dev (hot-reload)
#   COMPOSE_PROFILES=prod  -> db + api + web         (images buildees)
# Lancement : docker compose up      (db tourne dans les deux profils)
services:
  # ---------------------------------------------------------------------------
  # Base de donnees : sans profil -> presente en dev ET en prod.
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: youcus-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-youcus}
      MYSQL_USER: ${MYSQL_USER:-youcus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-youcus}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - youcus-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cache NoSQL : sans profil -> present en dev ET en prod.
  # L'API fonctionne sans lui (degradation vers l'appel direct a YouTube).
  # ---------------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: youcus-cache
    restart: unless-stopped
    # Cache pur : pas de persistance disque, les donnees sont reconstructibles.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Object storage of the note images (YC-50): sans profil -> dev ET prod en local.
  # Production uses Sevalla object storage (same S3 API). Console: http://localhost:9001
  # ---------------------------------------------------------------------------
  storage:
    image: quay.io/minio/minio:latest
    container_name: youcus-storage
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-youcus}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-youcus-dev-secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - youcus-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the private bucket once, then stops.
  storage-init:
    image: quay.io/minio/minio:latest
    container_name: youcus-storage-init
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://storage:9000 $${MINIO_USER} $${MINIO_PASSWORD} &&
      mc mb --ignore-existing local/$${BUCKET}"
    environment:
      MINIO_USER: ${S3_ACCESS_KEY_ID:-youcus}
      MINIO_PASSWORD: ${S3_SECRET_ACCESS_KEY:-youcus-dev-secret}
      BUCKET: ${S3_BUCKET:-youcus-notes}

  # ---------------------------------------------------------------------------
  # DEV : code source monte, hot-reload (tsx watch / Vite). Profil "dev".
  # ---------------------------------------------------------------------------
  api-dev:
    profiles: ["dev"]
    # Image complete (pas -slim) : inclut OpenSSL/libssl requis par Prisma.
    image: node:20-bookworm
    container_name: youcus-api-dev
    working_dir: /app
    command: >
      sh -c "npm install &&
      npm run prisma:generate &&
      (cd server && npx prisma migrate deploy) &&
      npm run dev:server"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    # Secrets (Google OAuth, YouTube) repris du server/.env existant s'il est present.
    env_file:
      - path: server/.env
        required: false
    # Ces valeurs ecrasent celles du env_file (specifiques au reseau Docker).
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "mysql://${MYSQL_USER:-youcus}:${MYSQL_PASSWORD:-youcus}@db:3306/${MYSQL_DATABASE:-youcus}"
      CLIENT_ORIGIN: http://localhost:5173
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      REDIS_URL: "redis://cache:6379"

    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./:/app
      - api-dev-node-modules:/app/node_modules

  web-dev:
    profiles: ["dev"]
    image: node:20-bookworm-slim
    container_name: youcus-web-dev
    working_dir: /app
    command: >
      sh -c "npm install &&
      npm run dev --workspace client -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api-dev
    environment:
      # Le navigateur tourne sur l'hote : il joint l'API via le port publie (API_PORT).
      VITE_API_URL: http://localhost:${API_PORT:-4000}/api
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - web-dev-node-modules:/app/node_modules

  # ---------------------------------------------------------------------------
  # PROD : images buildees (comme sur un serveur). Profil "prod".
  # ---------------------------------------------------------------------------
  api:
    profiles: ["prod"]
    # Context = repository root: the image also builds the client it serves (YC-11).
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: youcus-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "mysql://${MYSQL_USER:-youcus}:${MYSQL_PASSWORD:-youcus}@db:3306/${MYSQL_DATABASE:-youcus}"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      REDIS_URL: "redis://cache:6379"
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    profiles: ["prod"]
    build: ./client
    container_name: youcus-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  youcus-db-data:
  youcus-storage-data:
  api-dev-node-modules:
  web-dev-node-modules:
