name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Generer le client Prisma
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Verification des types
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
