name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  images:
    name: Build et push des images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: web
            context: ./client
          - service: api
            context: ./server
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/youcus-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/youcus-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploiement Sevalla
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Declencher le deploiement
        env:
          SEVALLA_DEPLOY_HOOK: ${{ secrets.SEVALLA_DEPLOY_HOOK }}
        run: |
          if [ -z "${SEVALLA_DEPLOY_HOOK}" ]; then
            echo "SEVALLA_DEPLOY_HOOK non configure : etape de deploiement ignoree."
            echo "Ajouter le secret dans Settings > Secrets and variables > Actions pour activer le deploiement."
            exit 0
          fi
          curl -fsSL -X POST "${SEVALLA_DEPLOY_HOOK}"
