name: CD

# Production moves with the version only (YC-106): deploy.sh writes VERSION and pushes main;
# a push to main that leaves VERSION alone deploys nothing. Sevalla's own auto-deploy is off.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  images:
    name: Build et push des images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: web
            context: ./client
            file: ./client/Dockerfile
          # Context = repository root: the API image also builds the client it serves (YC-11).
          - service: api
            context: .
            file: ./server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "value=$(cat VERSION 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/youcus-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/youcus-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/youcus-${{ matrix.service }}:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploiement Sevalla
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Declencher le deploiement
        env:
          SEVALLA_DEPLOY_HOOK: ${{ secrets.SEVALLA_DEPLOY_HOOK }}
        run: |
          # The hook is the only way production moves (YC-106): without it, fail loudly.
          if [ -z "${SEVALLA_DEPLOY_HOOK}" ]; then
            echo "::error::SEVALLA_DEPLOY_HOOK manquant : rien n'est deploye."
            echo "Le poser : gh secret set SEVALLA_DEPLOY_HOOK (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -fsSL -X POST "${SEVALLA_DEPLOY_HOOK}"
